<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>วิธีล้างมือ - MedEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .video-responsive {
      position: relative;
      padding-bottom: 56.25%;
      padding-top: 25px;
      height: 0;
    }
    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="text-gray-800">

  <header class="bg-green-600 py-4 shadow-lg">
    <h1 class="text-white text-2xl font-bold text-center">🧼 วิธีล้างมือที่ถูกต้อง</h1>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="video-responsive mb-6">
      <iframe 
        src="https://www.youtube.com/embed/dyIdMsmibvw" 
        title="วิดีโอสุขภาพ" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <h2 class="text-xl font-semibold text-green-700 mb-4">ขั้นตอนการล้างมือ 7 ขั้นตอน</h2>
    <ol class="list-decimal pl-6 text-gray-700 space-y-2">
      <li>ฝ่ามือถูฝ่ามือ</li>
      <li>หลังมือถูฝ่ามือ</li>
      <li>ถูซอกนิ้วมือ</li>
      <li>ถูหลังนิ้วมือ</li>
      <li>ถูนิ้วหัวแม่มือ</li>
      <li>ถูปลายนิ้วกับฝ่ามือ</li>
      <li>ถูรอบข้อมือ</li>
    </ol>
  </main>

  <footer class="text-center text-sm text-gray-500 py-4">
    © 2025 MedEase Health News
  </footer>

</body>
</html>
