<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการข่าวสุขภาพ - MedEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f9fafb; /* เทาอ่อน เรียบ ๆ */
      min-height: 100vh;
    }
    .add-form-card {
      border-radius: 0.75rem;
      border: 1px solid #e5e7eb;      /* เทาอ่อน */
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05); /* เงาบาง ๆ */
    }
  </style>
</head>
<body class="min-h-screen text-gray-700">
  <!-- Header -->
  <header class="border-b bg-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-center gap-3">
        <img
          src="image/Arisa.png"
          alt="MedEase Logo"
          class="w-9 h-9 rounded-full object-cover border border-gray-200"
        />
        <div>
          <p class="text-xs font-semibold text-sky-700">MedEase Admin</p>
          <!-- ข้อความนี้จะถูก JS เปลี่ยนเป็น “✏️ แก้ไขข่าว - MedEase” เมื่อมี ?id -->
          <h1 class="text-lg sm:text-xl font-bold">➕ เพิ่มข่าวใหม่ - MedEase</h1>
        </div>
      </div>
      <div class="flex justify-between sm:justify-end items-center gap-2 sm:gap-3">
        <span
          id="admin-email"
          class="italic text-xs sm:text-sm bg-gray-100 px-3 py-1 rounded-full text-gray-700 border border-gray-200 truncate"
        ></span>
        <button
          id="logoutBtn"
          class="bg-red-500 text-white px-3 py-1.5 rounded-md text-xs sm:text-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300"
        >
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-xl mx-auto p-6">
    <form
      id="newsForm"
      class="add-form-card bg-white p-6 sm:p-7 rounded-2xl space-y-5 mt-6"
    >
      <!-- หัวข้อ -->
      <div>
        <label for="topic" class="block text-sm font-medium text-gray-800">
          หัวข้อข่าว
        </label>
        <input
          id="topic"
          type="text"
          required
          class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-400"
        />
      </div>

      <!-- URL สื่อ -->
      <div>
        <label for="media" class="block text-sm font-medium text-gray-800">
          URL รูปภาพหรือวิดีโอ
        </label>
        <input
          id="media"
          type="url"
          required
          class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-400"
        />
        <p class="text-xs text-gray-500 mt-1">
          เช่น https://www.youtube.com/watch?v=xxxxx หรือ URL รูปภาพจากเว็บ/Storage
        </p>
      </div>

      <!-- ประเภทสื่อ -->
      <div>
        <label for="mediaType" class="block text-sm font-medium text-gray-800">
          ประเภทสื่อ
        </label>
        <select
          id="mediaType"
          required
          class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-400"
        >
          <option value="image">🖼️ รูปภาพ</option>
          <option value="youtube">🎥 วิดีโอ YouTube</option>
        </select>
      </div>

      <!-- เนื้อหา -->
      <div>
        <label for="detail" class="block text-sm font-medium text-gray-800">
          เนื้อหา (ใส่แต่ละบรรทัดแล้วกด Enter)
        </label>
        <textarea
          id="detail"
          rows="6"
          required
          class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 focus:border-sky-400"
          placeholder="• บรรทัดที่ 1&#10;• บรรทัดที่ 2"
        ></textarea>
      </div>

      <!-- ปุ่มบันทึก -->
      <button
        type="submit"
        class="w-full inline-flex items-center justify-center rounded-md bg-sky-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300"
      >
        💾 บันทึกข่าว
      </button>

      <p id="statusMsg" class="text-sm text-center hidden"></p>
    </form>
  </main>

  <!-- Firebase & Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp,
      doc, getDoc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAzRiHElsEa_PFOf90mJXzVELsuHwG5_fM",
      authDomain: "medeasehosting.firebaseapp.com",
      projectId: "medeasehosting",
      storageBucket: "medeasehosting.firebasestorage.app",
      messagingSenderId: "527953102643",
      appId: "1:527953102643:web:bce13ed6305ef583016046"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form        = document.getElementById("newsForm");
      const statusMsg   = document.getElementById("statusMsg");
      const adminEmail  = document.getElementById("admin-email");
      const logoutBtn   = document.getElementById("logoutBtn");
      const headerTitle = document.querySelector("header h1");
      const submitBtn   = form.querySelector('button[type="submit"]');
      const params      = new URLSearchParams(location.search);
      const editId      = params.get("id");
      let docRef        = null;

      // ตรวจสิทธิ์แอดมิน
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
        } else {
          const token = await user.getIdTokenResult();
          if (!token.claims.admin) {
            alert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
            window.location.href = "index.html";
            return;
          }
          adminEmail.textContent = user.email;

          // ถ้ามี id = แก้ไขข่าว
          if (editId) {
            headerTitle.textContent = "✏️ แก้ไขข่าว - MedEase";
            submitBtn.textContent   = "💾 บันทึกการแก้ไข";
            docRef = doc(db, "news", editId);
            try {
              const snap = await getDoc(docRef);
              if (!snap.exists()) {
                alert("ไม่พบบทความที่ต้องการแก้ไข");
                window.location.href = "admin.html";
                return;
              }
              const d = snap.data();
              form.topic.value     = d.topic || "";
              form.media.value     = d.media || "";
              form.mediaType.value = d.mediaType || "image";
              form.detail.value    = (d.detail || []).map(s => `• ${s}`).join("\n");
            } catch {
              alert("โหลดข้อมูลเพื่อแก้ไขล้มเหลว");
            }
          }
        }
      });

      // logout
      logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "login.html";
      });

      function convertToYouTubeEmbed(url) {
        const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
        return m ? `https://www.youtube.com/embed/${m[1]}` : url;
      }

      // submit form
      form.addEventListener("submit", async e => {
        e.preventDefault();
        statusMsg.classList.remove("hidden");
        statusMsg.className = "text-sm text-center text-gray-500";
        statusMsg.textContent = "⏳ กำลังบันทึกข้อมูล...";

        const topic     = form.topic.value.trim();
        let media       = form.media.value.trim();
        const mediaType = form.mediaType.value;
        const detail    = form.detail.value
          .split("\n")
          .map(s => s.replace(/^•\s*/, "").trim())
          .filter(Boolean);

        if (mediaType === "youtube") {
          media = convertToYouTubeEmbed(media);
        }

        try {
          if (editId && docRef) {
            await updateDoc(docRef, {
              topic, media, mediaType, detail,
              updatedAt: serverTimestamp(),
              updatedBy: auth.currentUser.email
            });
            statusMsg.textContent = "✅ แก้ไขข่าวเรียบร้อยแล้ว!";
            statusMsg.className   = "text-sm text-center text-green-700";
          } else {
            await addDoc(collection(db, "news"), {
              topic, media, mediaType, detail,
              createdAt: serverTimestamp(),
              byUser: auth.currentUser.email,
              views: 0
            });
            statusMsg.textContent = "✅ บันทึกข่าวเรียบร้อยแล้ว!";
            statusMsg.className   = "text-sm text-center text-green-700";
            form.reset();
          }
        } catch (err) {
          statusMsg.textContent = "❌ เกิดข้อผิดพลาด: " + err.message;
          statusMsg.className   = "text-sm text-center text-red-600";
        }
      });
    });
  </script>
</body>
</html>
