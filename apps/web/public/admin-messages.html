<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>MedEase – ศูนย์ข้อมูลแชท (Admin)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/messages.css" />

  <style>
    body { font-family: 'Sarabun', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen" data-page="admin-messages">
  <div class="min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="border-b bg-white/80 backdrop-blur-sm">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div>
          <h1 class="text-lg md:text-xl font-semibold text-slate-900">
            ศูนย์ข้อมูลแชท MedEase
          </h1>
          <p class="text-xs md:text-sm text-slate-500">
            สำหรับผู้ดูแลระบบ — ดูภาพรวมผู้ใช้และบทสนทนาทั้งหมด
          </p>
        </div>
        <div class="text-right">
          <p id="currentUserEmail" class="text-xs md:text-sm text-slate-600"></p>
          <span class="inline-flex items-center rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-medium text-emerald-700 border border-emerald-100">
            Admin / Staff
          </span>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-1">
      <div class="max-w-6xl mx-auto px-4 py-4 md:py-6">
        <!-- Filters -->
        <section class="mb-4 md:mb-6 rounded-xl bg-white/80 shadow-sm border border-slate-100 p-3 md:p-4">
          <div class="flex flex-col md:flex-row md:items-end gap-3 md:gap-4">
            <div class="flex-1">
              <label class="block text-xs font-medium text-slate-600 mb-1">
                ค้นหาผู้ใช้ (ชื่อ, อีเมล, LINE User Id)
              </label>
              <input
                id="adminSearchInput"
                type="text"
                placeholder="เช่น dark@ubu.ac.th หรือ Uxxxxxxxxx"
                class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
              />
            </div>

            <div class="flex flex-row md:flex-col gap-3 md:gap-1">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">
                  ใช้งานล่าสุด ตั้งแต่
                </label>
                <input
                  id="adminLastActiveFrom"
                  type="date"
                  class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">
                  ถึง
                </label>
                <input
                  id="adminLastActiveTo"
                  type="date"
                  class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
                />
              </div>
            </div>

            <div class="flex items-center gap-2 md:gap-3">
              <button
                id="adminRefreshBtn"
                class="inline-flex items-center justify-center rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs md:text-sm font-medium text-slate-700 hover:bg-slate-50 active:bg-slate-100"
              >
                รีเฟรชข้อมูล
              </button>
              <button
                id="adminClearFilterBtn"
                class="inline-flex items-center justify-center rounded-lg border border-transparent bg-slate-100 px-3 py-2 text-xs md:text-sm font-medium text-slate-700 hover:bg-slate-200 active:bg-slate-300"
              >
                ล้างตัวกรอง
              </button>
            </div>
          </div>

          <p id="adminStatusText" class="mt-2 text-xs text-slate-500"></p>
        </section>

        <!-- Table -->
        <section class="rounded-xl bg-white/90 shadow-sm border border-slate-100 overflow-hidden">
          <div class="border-b border-slate-100 px-3 md:px-4 py-2 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-800">
              ผู้ใช้ที่มีบทสนทนา
            </h2>
            <span id="adminUsersCount" class="text-[11px] text-slate-500"></span>
          </div>

          <div id="adminLoadingState" class="px-4 py-6 text-center text-sm text-slate-500">
            กำลังโหลดข้อมูล...
          </div>

          <div id="adminEmptyState" class="hidden px-4 py-6 text-center text-sm text-slate-500">
            ยังไม่พบข้อมูลผู้ใช้ที่มีบทสนทนา
          </div>

          <div class="overflow-x-auto">
            <table class="min-w-full text-left text-xs md:text-sm">
              <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                  <th class="px-3 md:px-4 py-2 font-medium text-slate-600">ผู้ใช้</th>
                  <th class="px-3 md:px-4 py-2 font-medium text-slate-600">อีเมล</th>
                  <th class="px-3 md:px-4 py-2 font-medium text-slate-600">LINE User Id</th>
                  <th class="px-3 md:px-4 py-2 font-medium text-slate-600 text-center">จำนวนบทสนทนา</th>
                  <th class="px-3 md:px-4 py-2 font-medium text-slate-600">ใช้งานล่าสุด</th>
                  <th class="px-3 md:px-4 py-2"></th>
                </tr>
              </thead>
              <tbody id="adminUsersTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Firebase + Logic -->
  <script type="module" src="/js/messages.js"></script>
</body>
</html>
